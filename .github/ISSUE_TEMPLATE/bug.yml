name: Bug
description: Something in HangTime is broken or showing the wrong thing.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem with HangTime. Issues on this repository are
        public, so anything you enter below, including your name and email, can be
        seen by anyone.
  - type: input
    id: name
    attributes:
      label: Name
      placeholder: Jane Doe
    validations:
      required: true
  - type: input
    id: email
    attributes:
      label: Email
      description: So we can follow up with you. This will be public.
      placeholder: jane@example.com
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug description
      description: What went wrong? Screenshots help.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What did you do before the bug happened?
      placeholder: |
        1. Open the Top Hangs tab
        2. Pick build 2026-09-24
        3. Click the first hang
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What did you expect to happen instead?
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and device
      description: Optional, but it helps with bugs that only show up in some browsers.
      placeholder: Safari on iPhone 15, iOS 26
    validations:
      required: false
